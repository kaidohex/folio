name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force
          $ver = ("${env:GITHUB_REF_NAME}") -replace '^v', ''
          Copy-Item target/release/folio.exe "dist/Folio-v$ver-windows-x64.exe"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/release/folio "dist/Folio-${GITHUB_REF_NAME}-linux-x64"
          chmod +x "dist/Folio-${GITHUB_REF_NAME}-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums
        run: |
          cd dist
          find . -type f | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-exe/*.exe
            dist/linux-bin/*
            dist/SHA256SUMS.txt
          generate_release_notes: true
