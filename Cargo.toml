[package]
name = "folio"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
chrono = "0.4.45"
eframe = { version = "0.37.0", features = ["default"] }
egui = "0.37"
feed-rs = "3.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
open = "5.4.5"
opml = "1.1.6"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "blocking"] }
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
winresource = "0.1.34"
